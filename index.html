<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Gerador de Senhas</h1>

        <div class="display-container">
            <input type="text" id="senhaGerada" placeholder="Sua senha segura" readonly>
            <button id="btnCopiar" title="Copiar para a área de transferência">📋</button>
        </div>

        <div class="settings">
            <div class="setting">
                <label for="comprimento">Comprimento da Senha</label>
                <input type="number" id="comprimento" min="4" max="32" value="12">
            </div>
            
            <div class="setting">
                <label for="maiusculas">Incluir Letras Maiúsculas (A-Z)</label>
                <input type="checkbox" id="maiusculas" checked>
            </div>
            
            <div class="setting">
                <label for="minusculas">Incluir Letras Minúsculas (a-z)</label>
                <input type="checkbox" id="minusculas" checked>
            </div>
            
            <div class="setting">
                <label for="numeros">Incluir Números (0-9)</label>
                <input type="checkbox" id="numeros" checked>
            </div>

            <div class="setting">
                <label for="simbolos">Incluir Símbolos (!@#$...)</label>
                <input type="checkbox" id="simbolos">
            </div>
        </div>

        <button class="btn btn-large" id="btnGerar">Gerar Senha</button>
    </div>

    <script src="Gerador_senha.js"></script>
</body>
</html>
